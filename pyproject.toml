[project]
name = "nightshift"
version = "0.1.0"
description = "Autonomous repo maintainer agents: health reports, PR reviews, fixes."
readme = "README.md"
authors = [
    { name = "mahesh", email = "maheshpulivarthi18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "fastapi>=0.157.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nightshift = "nightshift:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/nightshift/health/agents.py" = ["E501"]  # prompt text reads better unwrapped
"src/nightshift/chat.py" = ["E501"]  # prompt and tool descriptions
"src/nightshift/context/archmap.py" = ["E501"]  # prompt text and page template
