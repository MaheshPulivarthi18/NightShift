<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NightShift{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/repos">NightShift</a>
    <nav>
      <a href="/repos">Repos</a>
      <a href="/jobs">Jobs</a>
    </nav>
    <div class="spend">
      Today ${{ "%.2f"|format(spend.today) }} · Month ${{ "%.2f"|format(spend.this_month) }}
      <form method="post" action="/control/kill" class="inline">
        {% if killed %}
          <button class="danger" title="Model calls are blocked">Kill switch ON · resume</button>
        {% else %}
          <button class="ghost" title="Block every model call">Kill switch</button>
        {% endif %}
      </form>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
